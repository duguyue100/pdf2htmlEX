name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (linux)
        if: runner.os == 'Linux'
        run: docker build -f Dockerfile.alpine-static -t pdf2htmlex-static .

      - name: Export tarball (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          docker run --rm pdf2htmlex-static tar -cC /out . | tar -xC dist
          mv dist/pdf2htmlEX-linux-*.tar.gz \
             "dist/pdf2htmlEX-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz"

      - name: Build (macos)
        if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh

      - name: Rename tarball (macos)
        if: runner.os == 'macOS'
        run: |
          ls -la dist/ || true
          find . -maxdepth 4 -name '*.tar.gz' -not -path './dist/*' || true
          f=$(find . -maxdepth 4 -name 'pdf2htmlEX-macos-*.tar.gz' -not -path './dist/*' | head -1)
          [ -n "$f" ] || { echo "ERROR: no pdf2htmlEX-macos-*.tar.gz produced by build-macos.sh" >&2; exit 1; }
          mv -v "$f" "dist/pdf2htmlEX-${GITHUB_REF_NAME}-macos-arm64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: pdf2htmlEX-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz

      - name: Smoke-test installed layout (linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/inst/bin /tmp/inst/share
          tar -xzf "dist/pdf2htmlEX-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz" -C /tmp/inst
          cp /tmp/inst/pkg/bin/pdf2htmlEX /tmp/inst/bin/
          cp -R /tmp/inst/pkg/share/pdf2htmlEX /tmp/inst/share/
          rm -rf /usr/local/share/pdf2htmlEX
          cd /
          PATH="/tmp/inst/bin:$PATH" pdf2htmlEX $GITHUB_WORKSPACE/test/data/smoke.pdf /tmp/out.html >/dev/null 2>&1
          grep -q "Hello pdf2htmlEX revived" /tmp/out.html && echo "INSTALLED-LAYOUT SMOKE TEST PASSED"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          body_path: RELEASE_NOTES.md
